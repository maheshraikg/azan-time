name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish the APK to the "apk-latest" release

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        # A growing build number, so each build installs as an update.
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk waqt.apk

      # Smaller one-architecture APKs too (most phones: arm64; older: arm32).
      - name: Build per-architecture APKs
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      # Play Store bundle, signed with your upload key from the repository
      # secrets (the test APKs above keep the test key, so they still install
      # over earlier test builds). Skipped until the secrets are added.
      - name: Build Play Store bundle (.aab)
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "No upload key secrets: Play Store bundle skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KS" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
          flutter build appbundle --release --build-number=${{ github.run_number }}
          rm -f android/key.properties android/app/upload-keystore.jks
          cp build/app/outputs/bundle/release/app-release.aab azan-time.aab
          echo "Play Store bundle: azan-time.aab (version code ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"

      - name: APK size
        run: |
          ls -l waqt.apk build/app/outputs/flutter-apk/
          echo "APK: $(du -h waqt.apk | cut -f1) ($(stat -c %s waqt.apk) bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: azan-time-apk
          path: waqt.apk

      # A direct, sign-in-free download link that always serves the newest
      # build: https://github.com/<repo>/releases/download/apk-latest/waqt.apk
      - name: Publish APK to the apk-latest pre-release
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk waqt-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk waqt-arm32.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          extra=""; [ -f azan-time.aab ] && extra="azan-time.aab"
          gh release create apk-latest waqt.apk waqt-arm64.apk waqt-arm32.apk $extra \
            --target "$SHA" \
            --title "Azan Time – latest test build" \
            --notes "Latest Azan Time APK built from ${SHA:0:7}. For testing; signed with the fixed test key, so it installs over earlier test builds signed with it."
          echo "Direct download: https://github.com/${{ github.repository }}/releases/download/apk-latest/waqt.apk" >> "$GITHUB_STEP_SUMMARY"
